<!doctype html>
<!-- Minimal structural capture of the delivery timeout card observed in the installed launcher.
     No account, prompt, conversation or tool payload is included. -->
<main>
  <div data-turn-key="current">
    <div data-content-search-unit-key="current:assistant">
      <div data-conversation-role="assistant"></div>
      <div data-markdown-text-style="assistant-message"><p>Preserved progress.</p></div>
    </div>
    <div data-content-search-turn-key="current">
      <aside role="alert">
        <div><div>Message delivery timed out. Please try again.</div></div>
        <button type="button">Retry</button>
      </aside>
    </div>
  </div>
</main>
